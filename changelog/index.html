<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>更新履歴 — userkit</title>
  <meta name="description" content="userkit(zetaのuser向け非公式ツール集)のすべてのツールの更新履歴。">
  <meta name="theme-color" content="#6d5dfc">
  <link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/kit.css">
  <style>
    .logs { max-width: 880px; margin: 0 auto; padding: 32px 20px 0; }
    /* ツールで絞り込む札。広い画面では折り返し、狭い画面では横にすべらせる */
    .ch-filter { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 26px; padding-bottom: 4px; }
    .ch-filter button { flex: none; height: 32px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: 999px; background: var(--surface); font-size: 12.5px; font-weight: 700; color: var(--muted); }
    .ch-filter button:hover { color: var(--text); background: var(--soft); }
    .ch-filter button[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: #fff; }
    /* 1 日ずつ。左に日付、右にツールごとのまとまり(左にツールの名前、右に文) */
    .ch-day { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 20px; padding: 20px 0; border-top: 1px solid var(--line); }
    .ch-day h2 { font-size: 14px; line-height: 1.7; color: var(--muted); }
    .ch-groups { display: flex; flex-direction: column; gap: 16px; }
    .ch-group { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 6px 20px; }
    .ch-whos { display: flex; flex-direction: column; gap: 2px; }
    .ch-list { display: flex; flex-direction: column; gap: 6px; margin: 0; padding: 0; list-style: none; font-size: 14.5px; }
    /* 同じツールに文が 2 つ以上あるときだけ、頭に短い線を付けて分ける */
    .ch-list li { position: relative; padding-left: 16px; }
    .ch-list li::before { content: ""; position: absolute; left: 2px; top: .85em; width: 7px; height: 1.5px; background: var(--line-strong); }
    .ch-list li:only-child { padding-left: 0; }
    .ch-list li:only-child::before { content: none; }
    .ch-none { padding: 30px 0; color: var(--muted); border-top: 1px solid var(--line); }
    @media (max-width: 760px) {
      .ch-group { grid-template-columns: minmax(0, 1fr); }
    }
    @media (max-width: 600px) {
      .logs { padding: 22px 16px 0; }
      .ch-filter { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: thin; }
      .ch-day { grid-template-columns: minmax(0, 1fr); gap: 10px; }
      .ch-groups { gap: 14px; }
    }
  </style>
</head>
<body>
  <main class="logs">
    <div class="page-head">
      <div>
        <h1>更新履歴</h1>
        <p class="lead">userkit のすべてのツールの更新を、日付ごと・ツールごとに新しい順でまとめています。</p>
      </div>
    </div>
    <div class="ch-filter" id="filter" role="group" aria-label="ツールで絞り込む"></div>
    <div id="days"></div>
  </main>

  <script src="../assets/kit.js"></script>
  <script src="../assets/changelog.js"></script>
  <script>
    (function () {
      const { h } = U;
      const filter = document.getElementById('filter'), days = document.getElementById('days');
      // 札: すべて / サイト全体(#userkit) / 履歴のあるツール(Kit.TOOLS の並び)
      const used = new Set(Kit.CHANGELOG.flatMap((e) => e[1]));
      const keys = [['', 'すべて'], ['userkit', 'サイト全体'], ...Kit.TOOLS.filter((t) => used.has(t.id)).map((t) => [t.id, t.label])];
      let cur = keys.some(([k]) => k === location.hash.slice(1)) ? location.hash.slice(1) : '';
      filter.append(...keys.map(([k, label]) => h('button', { type: 'button', 'data-k': k }, label)));
      filter.addEventListener('click', (e) => {
        const b = e.target.closest('button');
        if (!b) return;
        cur = b.dataset.k;
        history.replaceState(null, '', cur ? '#' + cur : location.pathname);
        render();
      });
      function render() {
        for (const b of filter.children) b.setAttribute('aria-pressed', String(b.dataset.k === cur));
        const list = Kit.CHANGELOG.filter((e) => !cur || (cur === 'userkit' ? !e[1].length : e[1].includes(cur)));
        days.replaceChildren(...(list.length ? Kit.changeDays(list).map(([d, groups]) => h('section.ch-day',
          h('h2', h('time', { datetime: d }, Kit.fmtDay(d))),
          h('div.ch-groups', groups.map(([tools, texts]) => h('div.ch-group',
            h('div.ch-whos', Kit.changeWho(tools)),
            h('ul.ch-list', texts.map((t) => h('li', t)))))))) : [h('p.ch-none', 'この絞り込みでは、まだ更新がありません。')]));
      }
      Kit.mountBar('changelog');
      render();
      const on = filter.querySelector('[aria-pressed="true"]');
      if (on) filter.scrollLeft = on.offsetLeft - filter.offsetLeft - 16;  // #talklog などで開いたとき、選んだ札を見える所に
      document.body.append(Kit.footer());
    })();
  </script>
</body>
</html>
