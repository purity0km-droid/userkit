<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>usermovie — 映画のワンシーン</title>
  <meta name="description" content="写真に映画の字幕と黒帯を重ねて、映画のワンシーンのような画像や動画を作ります。字幕はtalklogのログから選べ、英語の字幕と縦書きの字幕も付けられます。">
  <meta name="theme-color" content="#d0507a">
  <link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="../assets/kit.css">
  <link rel="stylesheet" href="../assets/colorpick.css">
  <link rel="stylesheet" href="../assets/editor.css">
  <link rel="stylesheet" href="usermovie.css">
</head>
<body>
<main class="mov-app">
  <div class="page-head">
    <div>
      <h1>映画のワンシーン</h1>
      <p class="lead">写真に映画の字幕と黒帯を重ねて、映画のワンシーンのような画像や動画を作ります。字幕は talklog のログから選べ、英語の字幕と縦書きの字幕も付けられます。どこにも送らず、このブラウザの中だけで作ります。</p>
    </div>
  </div>
  <div id="help"></div>
  <div class="mov-work">
    <section class="mov-stage" id="stage" aria-label="画面">
      <div class="mov-view" id="view">
        <div class="mov-screen">
          <canvas id="screen" role="img" aria-label="字幕を重ねた映画の画面"></canvas>
          <div class="mov-drop" id="drop"><span>写真を選ぶ・ドラッグ・貼り付け</span></div>
        </div>
      </div>
      <div class="mov-strip" id="strip"></div>
    </section>
    <aside class="mov-side panel" id="side" aria-label="カットと字幕の設定"></aside>
  </div>
</main>
<input type="file" id="photoIn" accept="image/*" hidden>
<input type="file" id="logIn" accept=".html,.htm,.json,text/html,application/json" hidden>

<script src="../assets/kit.js"></script>
<script src="../assets/colorpick.js"></script>
<script src="../assets/editor.js"></script>
<script src="../assets/fonts.js"></script>
<script src="../assets/mp4.js"></script>
<script src="../assets/gif.js"></script>
<script src="usermovie.js"></script>
</body>
</html>
